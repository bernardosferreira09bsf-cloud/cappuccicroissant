        function renderMenu(filter = 'todos', search = '') {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            const filtered = menuData.filter(item => {
                const matchesCategory = filter === 'todos' || item.category === filter;
                const matchesSearch = item.name.toLowerCase().includes(search.toLowerCase()) || item.desc.toLowerCase().includes(search.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-zinc-400 text-sm">Nenhum item encontrado.</div>`;
                return;
            }

                    </button>

            });
            event.currentTarget.classList.remove('bg-white', 'text-zinc-600', 'border', 'border-brand');
            event.currentTarget.classList.add('bg-brand-primary', 'text-white', 'shadow-md');

            const search = document.getElementById('searchInput').value;
            renderMenu(cat, search);
        }
